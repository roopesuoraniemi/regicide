<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Regicide</title>
    <script>
      (function() {
        const BASE_WIDTH = 1350;
        const BASE_HEIGHT = 850;
        function applyScale() {
          const app = document.getElementById('app');
          if (!app) return;
          const scale = Math.min(window.innerWidth / BASE_WIDTH, window.innerHeight / BASE_HEIGHT, 1);
          app.style.setProperty('--app-scale', scale.toString());
        }
        window.addEventListener('resize', applyScale);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', applyScale);
        }
        document.addEventListener('DOMContentLoaded', applyScale);
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="menu-overlay">
        <div class="menu-content">
          <h1 style="color: var(--red-suit); font-size: 2.5rem; margin-bottom: 15px;">REGICIDE</h1>
          <p id="loading-status" style="color: var(--text-primary); font-size: 1.1rem;">Initializing application...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
